name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate deployment script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build and test
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Publish Agent service fixture
        shell: pwsh
        run: |
          dotnet publish src/SSC.Agent -c Release -r win-x64 --self-contained false -o artifacts/service-fixture
          if ($LASTEXITCODE) { throw 'Publish failed' }
          ./scripts/Write-SscDeploymentManifest.ps1 -Role Agent -Directory ./artifacts/service-fixture
      - name: Real SCM startup under virtual service identity
        timeout-minutes: 8
        shell: pwsh
        run: ./tests/Windows/AgentServiceStartup.ps1 -PublishDirectory ./artifacts/service-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
